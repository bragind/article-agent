name: CI/CD for Nick Branch

on:
  push:
    branches: [ nick ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Validate project structure
        run: |
          echo "📁 Checking project structure..."
          echo ""
          
          # Check required files
          if [ ! -f "app.py" ]; then
            echo "❌ app.py not found"
            exit 1
          fi
          echo "✅ app.py"
          
          if [ ! -f "src/bot.py" ]; then
            echo "❌ src/bot.py not found"
            exit 1
          fi
          echo "✅ src/bot.py"
          
          if [ ! -f "src/rag.py" ]; then
            echo "❌ src/rag.py not found"
            exit 1
          fi
          echo "✅ src/rag.py"
          
          if [ ! -f "requirements.txt" ]; then
            echo "❌ requirements.txt not found"
            exit 1
          fi
          echo "✅ requirements.txt"
          
          echo ""
          echo "🎯 All required files found!"
          
      - name: Test Python imports
        run: |
          echo "🔧 Testing Python imports..."
          python -c "
import sys
sys.path.insert(0, 'src')
try:
    from rag import RAGAgent
    print('✅ RAGAgent imported successfully')
    
    # Try to create instance
    agent = RAGAgent(data_dir='test_data')
    print(f'✅ RAGAgent created with {len(agent.all_articles)} articles')
    
except Exception as e:
    print(f'❌ Error: {e}')
    import traceback
    traceback.print_exc()
    sys.exit(1)
"
        
      - name: Check Docker files
        run: |
          echo "🐳 Checking Docker configuration..."
          
          if [ -f "Dockerfile" ]; then
            echo "✅ Dockerfile found"
          else
            echo "⚠️ Dockerfile not found"
          fi
          
          if [ -f "docker-compose.yml" ]; then
            echo "✅ docker-compose.yml found"
          else
            echo "⚠️ docker-compose.yml not found"
          fi
          
      - name: Create summary
        if: always()
        run: |
          echo "## 📊 CI/CD Report - Branch: nick" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`nick\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Checks passed:" >> $GITHUB_STEP_SUMMARY
          echo "1. Project structure" >> $GITHUB_STEP_SUMMARY
          echo "2. Python imports" >> $GITHUB_STEP_SUMMARY
          echo "3. Docker configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 Ready to merge to main!" >> $GITHUB_STEP_SUMMARY
