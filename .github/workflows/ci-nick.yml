name: CI/CD for Nick Branch

on:
  push:
    branches: [ nick ]
  pull_request:
    branches: [ nick ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio python-dotenv

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Check project structure
      run: |
        echo "📁 Проверка структуры проекта..."
        
        # Проверяем ключевые файлы
        REQUIRED_FILES=("app.py" "src/bot.py" "src/rag.py" "requirements.txt")
        
        for file in "${REQUIRED_FILES[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ Файл $file не найден!"
            exit 1
          else
            echo "✅ $file найден"
          fi
        done
        
        echo ""
        echo "🎯 Структура проекта корректна"

    - name: Check imports
      run: |
        echo "🔧 Проверка импортов..."
        python -c "
import sys
import os

print('📁 Текущая директория:', os.getcwd())
print('📁 Содержимое:', os.listdir('.'))

# Добавляем src в путь для импорта
sys.path.insert(0, 'src')

try:
    # Проверяем импорт из src
    from rag import RAGAgent, SearchScope
    print('✅ УСПЕХ: RAGAgent импортирован из src/rag.py')

    # Пробуем создать экземпляр
    agent = RAGAgent(data_dir='test_data_ci')
    print(f'✅ RAGAgent создан. Статей: {len(agent.all_articles)}')
    
    # Проверяем импорт bot.py
    import src.bot
    print('✅ bot.py может быть импортирован')

    # Проверяем, что app.py может быть загружен
    import importlib.util
    spec = importlib.util.spec_from_file_location('app', 'app.py')
    app_module = importlib.util.module_from_spec(spec)
    
    # Мокаем зависимости для импорта
    import sys
    mock_streamlit = type('MockSt', (), {})()
    mock_streamlit.secrets = {}
    mock_streamlit.session_state = type('MockState', (), {})()
    sys.modules['streamlit'] = mock_streamlit
    sys.modules['plotly.express'] = None
    sys.modules['plotly.graph_objects'] = None
    sys.modules['pandas'] = None
    
    spec.loader.exec_module(app_module)
    print('✅ app.py может быть загружен')
    
    print('\\n🎉 Все импорты работают корректно!')

except Exception as e:
    print(f'❌ Ошибка: {e}')
    import traceback
    traceback.print_exc()
    
    # Дополнительная диагностика
    print('\\n🔍 Диагностика:')
    print('Python path:', sys.path)
    print('Содержимое src/:', os.listdir('src') if os.path.exists('src') else 'src/ не существует')
    
    sys.exit(1)
"
    
    - name: Lint Python files
      run: |
        pip install flake8
        echo "📝 Проверка стиля кода..."
        flake8 app.py src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        echo ""
        echo "⚠️ Предупреждения (не критично):"
        flake8 app.py src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker-check:
    name: Docker Configuration Check
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Validate Docker setup
      run: |
        echo "🐳 Проверка Docker конфигурации..."
        
        # Проверяем Dockerfile
        if [ -f "Dockerfile" ]; then
          echo "✅ Dockerfile найден"
          # Проверяем копирование правильных файлов
          if grep -q "app.py" Dockerfile || grep -q "COPY \." Dockerfile; then
            echo "✅ app.py будет скопирован в контейнер"
          fi
          if grep -q "src/" Dockerfile; then
            echo "✅ src/ будет скопирован в контейнер"
          fi
        else
          echo "⚠️ Dockerfile не найден"
        fi
        
        # Проверяем docker-compose
        if [ -f "docker-compose.yml" ]; then
          echo "✅ docker-compose.yml найден"
        fi
        
        # Проверяем .env.example
        if [ -f ".env.example" ]; then
          echo "✅ .env.example найден"
        fi

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, docker-check]
    if: always()

    steps:
    - name: Create deployment summary
      run: |
        echo "## 📊 CI/CD Report - ветка nick" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Добавляем статусы jobs
        echo "### ✅ Jobs Status:" >> $GITHUB_STEP_SUMMARY
        echo "- **Tests:** ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Docker Check:** ${{ needs.docker-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Информация о проекте
        echo "### 🏗️ Project Structure:" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "article-agent/" >> $GITHUB_STEP_SUMMARY
        echo "├── app.py              # Streamlit app (root)" >> $GITHUB_STEP_SUMMARY
        echo "├── src/" >> $GITHUB_STEP_SUMMARY
        echo "│   ├── bot.py          # Telegram bot" >> $GITHUB_STEP_SUMMARY
        echo "│   └── rag.py          # RAG agent" >> $GITHUB_STEP_SUMMARY
        echo "├── tests/              # Tests" >> $GITHUB_STEP_SUMMARY
        echo "├── data/               # Data directory" >> $GITHUB_STEP_SUMMARY
        echo "└── docker/            # Docker configs" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Инструкции
        echo "### 🚀 Deployment Instructions:" >> $GITHUB_STEP_SUMMARY
        echo "1. Clone the repository" >> $GITHUB_STEP_SUMMARY
        echo "2. Copy `.env.example` to `.env` and set TELEGRAM_BOT_TOKEN" >> $GITHUB_STEP_SUMMARY
        echo "3. Run `docker-compose up -d`" >> $GITHUB_STEP_SUMMARY
        echo "4. Access web interface at http://localhost:8501" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Branch: nick | Triggered by: ${{ github.actor }}*" >> $GITHUB_STEP_SUMMARY